name: Sydes

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  sydes:
    # Sydes Runtime Evidence — Beta from released artifacts only: sydes-action v2, Sydes from
    # PyPI, DiffGenome from PyPI, Linux bubblewrap sandbox, tests selected automatically.
    uses: sydes-examples/sydes-action/.github/workflows/verify.yml@v2
    with:
      repo_alias: app
      model: openai:gpt-6.1-sol
      ai_recovery: false
      runner: ubuntu-latest
      runtime_evidence: auto
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
