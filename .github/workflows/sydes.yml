name: Sydes

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  sydes:
    uses: sydes-examples/sydes-action/.github/workflows/verify.yml@main
    with:
      repo_alias: app
      model: openai:gpt-5.6-sol
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
